name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Julia ${{ matrix.version }} - ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        version: ['1.10', '1']
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: julia-actions/setup-julia@v3
        with:
          version: ${{ matrix.version }}
      - uses: julia-actions/cache@v3
      - uses: julia-actions/julia-buildpkg@v1
      # Provisions the pinned MoSQITo checkout so the Annex B.4 end-to-end
      # conformance testset (test/runtests.jl's "ISO 532-1:2017 Annex B.4
      # end-to-end conformance" testset) runs instead of self-skipping. This
      # repo's front end is pure Julia -- no uv/python subprocess needed at
      # test time, just the checked-out .wav on disk. Restricted to
      # ubuntu/macos: the test hardcodes POSIX paths (joinpath("/tmp",
      # "mosqito-pinned", ...)), which do not resolve consistently on
      # windows-latest (no native /tmp, and Actions' default pwsh shell
      # doesn't share Git Bash's /tmp mapping), so the clone destination and
      # the path the Julia test looks for could diverge. Windows keeps the
      # visible @test_skip instead of a false pass/fail.
      - name: Clone pinned MoSQITo checkout (Annex B conformance reference material)
        if: matrix.os != 'windows-latest'
        run: |
          git clone https://github.com/Eomys/MoSQITo /tmp/mosqito-pinned
          git -C /tmp/mosqito-pinned checkout d990c33f94f1b2050b2d811dea492219ebe97b30
      - uses: julia-actions/julia-runtest@v1
      - uses: julia-actions/julia-processcoverage@v1
        if: matrix.version == '1' && matrix.os == 'ubuntu-latest'
      - uses: codecov/codecov-action@v7
        if: matrix.version == '1' && matrix.os == 'ubuntu-latest'
        with:
          files: lcov.info
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false
